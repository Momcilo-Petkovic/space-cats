# Runs the whole game with one command:  docker compose up --build
# then open http://localhost:8000
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: space_cats
      MARIADB_USER: space_cats
      MARIADB_PASSWORD: space_cats
      MARIADB_ROOT_PASSWORD: space_cats_root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: space_cats
      DB_PASSWORD: space_cats
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8000:80"
    depends_on:
      - backend

volumes:
  db-data:
