spring.application.name=space-cats

# Database settings come from environment variables, with defaults for a local MariaDB.
# The database is created automatically on first start (createDatabaseIfNotExist=true),
# and the tables are created by Hibernate (ddl-auto=update).
#   DB_HOST (localhost)  DB_PORT (3306)  DB_NAME (space_cats)  DB_USER (root)  DB_PASSWORD (empty)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:space_cats}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Your own credentials can also go in application-local.properties next to this file.
# That file is ignored by git, so passwords never get committed.
spring.config.import=optional:classpath:application-local.properties
